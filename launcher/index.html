<!doctype html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>私人扑克游戏</title>
<style>
:root{font-family:Arial,"Microsoft YaHei",sans-serif;color:#f3f8f5;background:#06130e;--gold:#dfbd69;--line:#345b4a;--green:#2d8b62}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 0%,#174a37 0,transparent 34%),radial-gradient(circle at 82% 16%,rgba(223,189,105,.09),transparent 25%),linear-gradient(180deg,#07150f,#040e0b);overflow-x:hidden}
body:before,body:after{position:fixed;pointer-events:none;font-weight:900;color:rgba(255,255,255,.018);line-height:1}body:before{content:'♠';font-size:34vw;left:-7vw;bottom:-10vw}body:after{content:'♦';font-size:27vw;right:-3vw;top:-4vw;color:rgba(223,189,105,.025)}
.panel{position:relative;width:min(94vw,660px);background:linear-gradient(145deg,rgba(18,45,34,.97),rgba(8,25,18,.98));padding:32px;border-radius:26px;border:1px solid rgba(223,189,105,.25);box-shadow:0 30px 90px #0009,inset 0 1px rgba(255,255,255,.04);backdrop-filter:blur(12px)}
.panel:before{content:'PRIVATE TABLE';display:block;color:var(--gold);font-size:11px;font-weight:900;letter-spacing:.26em;margin-bottom:7px;opacity:.9}h1{margin:0 0 8px;font-size:40px;letter-spacing:-.025em}p{color:#a8bbb2;line-height:1.55}.joinTitle{font-weight:900;color:#e9f1ed;border-top:1px solid rgba(223,189,105,.16);margin-top:22px;padding-top:18px}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 18px}.mode{position:relative;border:1px solid #345b4a;background:linear-gradient(145deg,#0d261c,#091b14);padding:16px 13px;border-radius:15px;cursor:pointer;transition:.16s ease;box-shadow:0 6px 16px rgba(0,0,0,.14)}.mode:hover{transform:translateY(-2px);border-color:#648875}.mode.active{border-color:var(--gold);background:linear-gradient(145deg,#1d4937,#123127);box-shadow:0 0 0 1px rgba(223,189,105,.18),0 9px 22px rgba(0,0,0,.2)}.mode.active:after{content:'✓';position:absolute;right:10px;top:9px;color:#f2d98f;font-weight:900}.mode b{display:block;font-size:17px;margin-bottom:5px}.mode small{display:block;color:#9eb3a9;line-height:1.4}
input{width:100%;padding:14px;margin:7px 0;border-radius:12px;border:1px solid #345b4a;background:#071711d9;color:white;font-size:16px;box-shadow:inset 0 2px 8px #0004}input:focus{outline:2px solid rgba(223,189,105,.35);border-color:var(--gold)}.row{display:flex;gap:10px;margin-top:10px}button{flex:1;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:13px;background:linear-gradient(180deg,#35966d,#267552);color:white;font-size:16px;font-weight:900;cursor:pointer;box-shadow:0 7px 18px rgba(0,0,0,.2);transition:.15s ease}button:hover{transform:translateY(-1px);filter:brightness(1.08)}.msg{color:#ffd27d;min-height:22px;margin-top:12px;font-weight:700}
@media(max-width:640px){.panel{padding:24px 18px}.modes{grid-template-columns:1fr}.mode{padding:13px}h1{font-size:32px}body:before,body:after{display:none}}

.heroMark{color:var(--gold);font-size:11px;font-weight:900;letter-spacing:.30em;margin-bottom:7px;opacity:.9}.slogan{color:#90a99d;font-size:13px;margin:-1px 0 21px}.modeIcon{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;margin:0 auto 10px;background:linear-gradient(145deg,#173c2d,#0b251b);border:1px solid rgba(223,189,105,.18);font-size:23px;color:#e7cb84;box-shadow:inset 0 1px rgba(255,255,255,.04),0 7px 18px #0003}.mode.active .modeIcon{background:linear-gradient(145deg,#dfbd69,#9d7131);color:#20170a;border-color:#f1d998;box-shadow:0 0 22px rgba(223,189,105,.18)}
</style></head><body>
<div class="panel">
<div class="heroMark">PRIVATE POKER CLUB</div><h1>♠ 私人扑克游戏</h1><div class="slogan">三种玩法 · 同一房间体系 · 私人牌桌</div>
<p>创建房间时选择玩法；加入房间时只需要输入房间号，系统会自动识别玩法。</p>

<div class="joinTitle" style="border-top:0;margin-top:8px;padding-top:0">创建房间</div>
<div class="modes">
  <div class="mode active" data-mode="zjh"><div class="modeIcon">♦</div><b>炸金花</b><small>三张牌 · 比牌 · 开牌</small></div>
  <div class="mode" data-mode="long"><div class="modeIcon">♠</div><b>德州扑克（长牌）</b><small>52张标准牌 · 经典规则</small></div>
  <div class="mode" data-mode="short"><div class="modeIcon">♣</div><b>德州扑克（短牌）</b><small>36张牌（6–A）· Short Deck</small></div>
</div>
<input id="name" placeholder="昵称">
<div class="row"><button id="create">创建房间</button></div>

<div class="joinTitle">加入已有房间</div>
<input id="joinName" placeholder="昵称">
<input id="room" placeholder="5位房间号" maxlength="5">
<div class="row"><button id="join">加入房间</button></div>
<div class="msg" id="msg"></div>
</div>

<script>
let mode='zjh';
const paths={zjh:'/games/zjh/',long:'/games/long/',short:'/games/short/'};
document.querySelectorAll('.mode').forEach(el=>el.onclick=()=>{
  document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');mode=el.dataset.mode;
});
const msg=document.getElementById('msg');

async function createRoom(){
  const name=document.getElementById('name').value.trim();
  if(!name){msg.textContent='请先输入昵称';return}
  msg.textContent='正在创建房间...';
  try{
    const r=await fetch(`/api/rooms/allocate?mode=${encodeURIComponent(mode)}`);
    const d=await r.json();
    if(!d.ok){msg.textContent=d.msg||'创建失败';return}
    const q=new URLSearchParams({auto:'create',name,room:d.code});
    location.href=`${paths[mode]}?${q}`;
  }catch(e){msg.textContent='服务器连接失败';}
}

async function joinRoom(){
  const name=document.getElementById('joinName').value.trim();
  const room=document.getElementById('room').value.trim();
  if(!name){msg.textContent='请先输入昵称';return}
  if(!/^\d{5}$/.test(room)){msg.textContent='请输入5位房间号';return}
  msg.textContent='正在查找房间...';
  try{
    const r=await fetch(`/api/rooms/lookup?code=${encodeURIComponent(room)}`);
    const d=await r.json();
    if(!d.ok){msg.textContent='房间不存在';return}
    const q=new URLSearchParams({auto:'join',name,room});
    location.href=`${paths[d.mode]}?${q}`;
  }catch(e){msg.textContent='服务器连接失败';}
}
document.getElementById('create').onclick=createRoom;
document.getElementById('join').onclick=joinRoom;
document.getElementById('room').oninput=e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,5);
</script>
</body></html>
